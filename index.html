<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abo Zahra</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--sf:#fff;--tx:#1b2a2a;--mu:#6b7776;--me:#d9f2ee;--bd:#e2ddd2;--gold:#c9a24b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Arial,sans-serif;min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100dvh;display:flex;flex-direction:column}
.box{margin:auto;padding:24px;width:100%;display:flex;flex-direction:column;justify-content:center}
.logo{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;background:linear-gradient(135deg,#0a3532,#0f766e);display:grid;place-items:center;color:var(--gold);font-size:46px;font-weight:700}
h1{text-align:center;margin:0 0 6px}p.s,.hint{color:var(--mu);text-align:center}
input{font:inherit;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:100%;margin:6px 0}
button{font:inherit;border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#0f766e,#0a3532);color:#fff;cursor:pointer}
button.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.w{width:100%;margin:6px 0}.or{text-align:center;color:var(--mu);margin:8px}
header{display:flex;align-items:center;gap:8px;padding:10px;background:#0a3532;color:#fff}
header .t{flex:1}header b{display:block}header small{color:#bfe7de}
#list{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 13px;border-radius:16px;background:var(--sf);box-shadow:0 1px 3px #0002;overflow-wrap:anywhere}
.m.me{align-self:flex-start;background:var(--me)}.m:not(.me){align-self:flex-end}
.m b{display:block;font-size:12px;margin-bottom:3px}.m small{display:block;color:var(--mu);font-size:11px;margin-top:4px}
form{display:flex;gap:6px;padding:10px;background:var(--sf)}form input{margin:0;flex:1;min-width:0}
#status{padding:6px;color:var(--mu);font-size:12px;text-align:center}
#members{font-size:11px;color:#bfe7de}
.codebox{direction:ltr;text-align:center;background:#fff;border:1px dashed #0f766e;padding:12px;border-radius:12px;font-weight:700;overflow-wrap:anywhere;margin:8px 0}
</style>
</head>
<body><div id="app"><div class="box"><div class="logo">ز</div><h1>Abo Zahra</h1><p class="s">جاري الاتصال...</p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyBKYLokVS0Zago9XI4V6FoZ4biYw3Aqchg",
 authDomain:"abo-zahra-47dce.firebaseapp.com",
 databaseURL:"https://abo-zahra-47dce-default-rtdb.firebaseio.com",
 projectId:"abo-zahra-47dce",
 storageBucket:"abo-zahra-47dce.firebasestorage.app",
 messagingSenderId:"364995516858",
 appId:"1:364995516858:web:42234301ffc7bc2c52e583",
 measurementId:"G-TWLYB1HT9E"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database(),$=s=>document.querySelector(s);
let me=null,roomRef=null,membersRef=null,messagesRef=null,messagesListener=null,membersListener=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showError(e){const el=$('#err');if(el)el.textContent=e?.message||'حصل خطأ. راجع اتصال الإنترنت وقواعد Firebase.'}
function login(){
 $('#app').innerHTML=`<div class="box"><div class="logo">ز</div><h1>Abo Zahra</h1><p class="s">دردشة جماعية مباشرة</p>
 <input id="nm" maxlength="20" placeholder="اكتب اسمك">
 <button class="w" onclick="createGroup()">إنشاء مجموعة جديدة</button><div class="or">أو</div>
 <input id="cd" maxlength="30" placeholder="الصق كود الدعوة كاملًا" style="direction:ltr;text-align:center">
 <button class="g w" onclick="joinGroup()">انضمام للمجموعة</button><p class="hint" id="err"></p></div>`;
}
function nameValue(){return ($('#nm')?.value||'').trim()}
function randomPart(n){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<n;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
function inviteText(){return me.code+'-'+me.secret}
async function createGroup(){
 const name=nameValue();if(!name){$('#err').textContent='اكتب اسمك الأول';return}
 try{
  const code=randomPart(8),secret=randomPart(20),uid=auth.currentUser.uid;
  const group={inviteSecret:secret,members:{[uid]:{name,joinedAt:Date.now()}}};
  await db.ref('groups/'+code).set(group);
  me={uid,name,code,secret};sessionStorage.setItem('az_session',JSON.stringify(me));openChat();
  alert('كود الدعوة للمجموعة: '+inviteText()+'\nانسخه وابعته للأعضاء اللي هينضموا.');
 }catch(e){showError(e)}
}
async function joinGroup(){
 const name=nameValue(),raw=($('#cd').value||'').trim().toUpperCase(),parts=raw.split('-');
 if(!name){$('#err').textContent='اكتب اسمك الأول';return}
 if(parts.length!==2||!/^[A-Z0-9]{8}$/.test(parts[0])||!/^[A-Z0-9]{20}$/.test(parts[1])){$('#err').textContent='كود الدعوة غير صحيح؛ الصق الكود كاملًا كما وصلك';return}
 const [code,secret]=parts;
 try{
  const uid=auth.currentUser.uid,ref=db.ref('groups/'+code),members=ref.child('members');
  const snap=await members.once('value');
  if(snap.numChildren()>=20&&!snap.hasChild(uid)){$('#err').textContent='المجموعة مكتملة (20 عضو)';return}
  await members.child(uid).set({name,joinedAt:Date.now(),inviteSecret:secret});
  await members.child(uid).child('inviteSecret').remove();
  me={uid,name,code,secret};sessionStorage.setItem('az_session',JSON.stringify(me));openChat();
 }catch(e){showError(e)}
}
function openChat(){
 $('#app').innerHTML=`<header><div class="logo" style="width:42px;height:42px;font-size:23px;margin:0;border-radius:13px">ز</div><div class="t"><b>Abo Zahra</b><small id="members">المجموعة ${me.code}</small></div><button class="g" onclick="copyCode()">نسخ الدعوة</button><button class="g" onclick="logout()">خروج</button></header><div id="list"></div><div id="status">متصل بقاعدة البيانات</div><form onsubmit="return sendMessage(event)"><input id="msg" maxlength="2000" placeholder="اكتب رسالة..." autocomplete="off"><button>إرسال</button></form>`;
 roomRef=db.ref('groups/'+me.code);membersRef=roomRef.child('members');messagesRef=roomRef.child('messages');
 membersListener=s=>{const names=[];s.forEach(c=>{const v=c.val()||{};if(v.name)names.push(v.name)});const el=$('#members');if(el)el.textContent=`${names.length}/20 أعضاء: ${names.join('، ')}`};
 membersRef.on('value',membersListener);
 messagesListener=s=>{const list=$('#list');if(!list)return;const data=[];s.forEach(c=>data.push({key:c.key,...(c.val()||{})}));list.innerHTML=data.map(m=>`<div class="m ${m.from===me.uid?'me':''}"><b>${esc(m.name||'عضو')}</b>${esc(m.text||'')}<small>${new Date(m.ts||Date.now()).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<p class="hint">ابدأ المحادثة برسالة جديدة.</p>';list.scrollTop=list.scrollHeight};
 messagesRef.limitToLast(300).on('value',messagesListener);
}
async function sendMessage(e){
 e.preventDefault();const input=$('#msg'),text=(input.value||'').trim();if(!text)return false;input.value='';
 try{await messagesRef.push({from:me.uid,name:me.name,text,ts:firebase.database.ServerValue.TIMESTAMP})}
 catch(err){input.value=text;alert('تعذر إرسال الرسالة: '+err.message)}
 return false;
}
function copyCode(){
 const code=inviteText();
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).then(()=>alert('تم نسخ كود الدعوة')).catch(()=>alert('كود الدعوة: '+code));
 else alert('كود الدعوة: '+code);
}
function logout(){
 if(messagesRef&&messagesListener)messagesRef.off('value',messagesListener);
 if(membersRef&&membersListener)membersRef.off('value',membersListener);
 sessionStorage.removeItem('az_session');me=null;login();
}
auth.signInAnonymously().then(()=>{try{const saved=JSON.parse(sessionStorage.getItem('az_session')||'null');if(saved&&saved.uid===auth.currentUser.uid){me=saved;openChat()}else login()}catch(e){login()}})
.catch(e=>{$('#app').innerHTML='<div class="box"><h1>Abo Zahra</h1><p class="hint">تعذر تسجيل الدخول إلى Firebase: '+esc(e.message)+'</p></div>'});
</script></body></html>
